name: Generate Spec from Brief

on:
  push:
    paths:
      - "feature-briefs/**.md"
      - "!feature-briefs/TEMPLATE.md"
      - "!feature-briefs/README.md"
  workflow_dispatch:
    inputs:
      brief_file:
        description: "Path to feature brief (e.g. feature-briefs/page-view.md)"
        required: true
        type: string

jobs:
  generate-spec:
    name: Generate analytics spec
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Install agent dependencies
        working-directory: agents/spec-generator
        run: npm ci

      - name: Determine brief file
        id: brief
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "file=${{ inputs.brief_file }}" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'feature-briefs/' | grep -E '^feature-briefs/.+\.md$' | grep -vE '^feature-briefs/(TEMPLATE|README)\.md$' | head -1)
            echo "Detected brief file: $CHANGED"
            if [[ -z "$CHANGED" ]]; then
              echo "ERROR: No brief file detected in this commit"
              exit 1
            fi
            echo "file=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine target mode
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${{ github.ref }}"
            BRANCH="${REF#refs/heads/}"
            if [[ "$BRANCH" == "main" ]]; then
              echo "mode=main" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "Mode: main (push directly to main)"
            else
              echo "mode=in-place" >> "$GITHUB_OUTPUT"
              echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
              echo "Mode: in-place (push to $BRANCH)"
            fi
          else
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "Mode: dispatch (workflow_dispatch)"
          fi

      - name: Check if spec already exists (main mode only)
        id: spec_check
        run: |
          if [[ "${{ steps.target.outputs.mode }}" != "main" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SPEC_COUNT=$(find specs/ -name "SPEC-*.yaml" -newer feature-briefs/.gitkeep | wc -l)
          BRIEF_FILE="${{ steps.brief.outputs.file }}"
          BRIEF_BASE=$(basename "$BRIEF_FILE" .md)
          YEAR=$(date +%Y)
          if ls specs/SPEC-${YEAR}-*.yaml 2>/dev/null | head -1 > /dev/null; then
            for spec in specs/SPEC-${YEAR}-*.yaml; do
              if grep -q "source_brief.*${BRIEF_BASE}\|brief.*${BRIEF_BASE}" "$spec" 2>/dev/null; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Spec already exists for this brief. Skipping."
                exit 0
              fi
            done
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No existing spec found for this brief. Will generate."

      - name: Generate spec YAML
        if: steps.spec_check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BRIEF_FILE="${{ steps.brief.outputs.file }}"
          YEAR=$(date +%Y)

          TEMP_FILE="specs/temp-spec.yaml"
          if ! node agents/spec-generator/run.js --brief-file "$BRIEF_FILE" > "$TEMP_FILE"; then
            echo "--- spec generator failed, file contents ---"
            cat "$TEMP_FILE"
            exit 1
          fi

          EVENT_NAME=$(grep -m1 '^\s*- name:' "$TEMP_FILE" | sed 's/.*name:\s*//' | tr -d '"' | tr -d "'" | xargs)

          if [[ -z "$EVENT_NAME" ]]; then
            echo "ERROR: Could not extract event_name from generated spec"
            cat "$TEMP_FILE"
            exit 1
          fi
          SPEC_FILE="specs/SPEC-${YEAR}-${EVENT_NAME}.yaml"

          mv "$TEMP_FILE" "$SPEC_FILE"
          SPEC_ID="${SPEC_FILE%.yaml}"
          SPEC_ID="${SPEC_ID#specs/}"
          sed -i "s/^spec_id:.*/spec_id: ${SPEC_ID}/" "$SPEC_FILE"
          echo "Brief : $BRIEF_FILE"
          echo "Event : $EVENT_NAME"
          echo "Output: $SPEC_FILE"
          echo "spec_file=$SPEC_FILE" >> "$GITHUB_ENV"

      - name: Commit spec to brief branch (in-place mode)
        if: steps.spec_check.outputs.skip != 'true' && steps.target.outputs.mode == 'in-place'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="${{ steps.target.outputs.branch }}"
          SPEC_FILE="${{ env.spec_file }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_FILE"
          git commit -m "feat(spec): auto-generate $SPEC_FILE"
          git push origin HEAD:"$BRANCH"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null)
          if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
            gh pr comment "$PR_NUMBER" --body "## Auto-generated spec added

          | Field | Value |
          |---|---|
          | Brief | \`${{ steps.brief.outputs.file }}\` |
          | Spec | \`$SPEC_FILE\` |
          | Generator | \`claude-api\` |
          | Status | \`draft\` — awaiting analyst review |"
            echo "Posted comment to PR #$PR_NUMBER"
          fi

      - name: Commit spec to main (brief landed directly on main)
        if: steps.spec_check.outputs.skip != 'true' && steps.target.outputs.mode == 'main'
        run: |
          SPEC_FILE="${{ env.spec_file }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_FILE"
          git commit -m "feat(spec): auto-generate $SPEC_FILE"
          git push origin HEAD:main
          echo "Spec committed directly to main."

      - name: Open PR with generated spec (workflow_dispatch only)
        if: steps.spec_check.outputs.skip != 'true' && steps.target.outputs.mode == 'dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "spec/auto-fb-${{ steps.brief.outputs.file }}"
          commit-message: "feat(spec): auto-generate ${{ env.spec_file }}"
          title: "Auto-spec: ${{ env.spec_file }}"
          body: |
            ## Auto-generated spec

            | Field | Value |
            |---|---|
            | Brief | `${{ steps.brief.outputs.file }}` |
            | Spec | `${{ env.spec_file }}` |
            | Generator | `claude-api` |
            | Status | `draft` — awaiting analyst review |

            **Next steps:**
            1. Review spec for accuracy
            2. Fill any `NEEDS_CLARIFICATION` fields
            3. Approve and merge
          labels: "spec,auto-generated,needs-review"

      - name: Run schema drift check
        if: steps.spec_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          SPEC_FILE="${{ env.spec_file }}"
          MODE="${{ steps.target.outputs.mode }}"
          BRANCH="${{ steps.target.outputs.branch }}"

          if [[ "$MODE" == "in-place" ]]; then
            echo "=== In-place mode: spec already on disk ==="
          elif [[ "$MODE" == "dispatch" ]]; then
            BRANCH="spec/auto-fb-${{ steps.brief.outputs.file }}"
            echo "=== Dispatch mode: restoring spec from $BRANCH ==="
            git fetch origin "$BRANCH" || true
            git checkout "origin/$BRANCH" -- "$SPEC_FILE" 2>/dev/null || true
          else
            echo "=== Main mode: spec already on disk ==="
          fi

          echo "=== Specs on disk ==="
          ls specs/

          echo "=== Baseline spec_ids ==="
          grep spec_id schema-baseline.json || echo "(no baseline spec_ids yet)"

          set +e
          node agents/schema-guardian/diff.js 2>&1 > /tmp/drift-report.txt
          EXIT_CODE=$?
          set -e

          cat /tmp/drift-report.txt

          if [[ "$MODE" == "in-place" && -n "$BRANCH" ]]; then
            PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null)
            if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
              gh pr comment "$PR_NUMBER" --body "$(cat /tmp/drift-report.txt)"
              echo "Posted drift report to PR #$PR_NUMBER"
            fi
          fi

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "Breaking schema changes detected."
            exit 1
          fi
