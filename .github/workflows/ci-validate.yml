name: CI Validate

# Triggered on every push and PR. The linter iterates over all specs in specs/,
# so it will report green even when the diff touches no spec files — which is the
# behavior required by branch protection (the check must always report a status).
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linter dependencies
        working-directory: scripts/linter
        run: npm install
      - name: Run spec linter
        run: |
          for f in specs/*.yaml; do
            [ -f "$f" ] || continue
            node scripts/linter/spec-linter.js "$f"
          done
