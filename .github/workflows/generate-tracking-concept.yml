name: Generate Tracking Concept for Devs

on:
  workflow_run:
    workflows:
      - "Update Schema Baseline"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Path to spec YAML (e.g. specs/SPEC-2026-001-page_view.yaml)'
        required: true

jobs:
  generate-docs:
    name: Generate tracking concept docs from spec
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tracking-concept-generator dependencies
        run: |
          cd agents/tracking-concept-generator
          npm install

      - name: Resolve spec files
        id: changed-specs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="${{ github.event.inputs.spec_file }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            CHANGED=$(git log --diff-filter=A --name-only --pretty=format: -- 'specs/*.yaml' \
              | grep -v '^$' | head -1 || true)
          else
            CHANGED=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} \
              | grep '^specs/.*\.yaml$' || true)
          fi
          echo "specs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Specs to process: $CHANGED"

      - name: Generate tracking concept docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          while IFS= read -r spec_file; do
            spec_file=$(echo "$spec_file" | tr -d '[:space:]')
            [ -z "$spec_file" ] && continue
            echo "→ Generating doc for: $spec_file"
            node agents/tracking-concept-generator/run.js --spec "$spec_file"
          done <<< "${{ steps.changed-specs.outputs.specs }}"

      - name: Commit generated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking-concepts/
          if git diff --staged --quiet; then
            echo "No files changed — nothing to commit."
          else
            git commit -m "chore: auto-generate docs from spec [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main --force-with-lease=HEAD
          fi
