name: Schema Drift Detection

on:
  pull_request:
    branches:
      - main

jobs:
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^specs/' || true)
          if [ -z "$CHANGED" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "✓ No spec changes — skipping drift check (reporting success)"
            {
              echo "## ✅ Schema Drift — N/A for this PR"
              echo ""
              echo "This PR contains no \`specs/**\` files. Drift detection does not apply to brief-only PRs."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Changed spec files:"
            echo "$CHANGED"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Run schema drift diff
        if: steps.changes.outputs.relevant == 'true'
        id: diff
        run: |
          set +e
          node agents/schema-guardian/diff.js 2>&1 > /tmp/drift-report.txt
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          cat /tmp/drift-report.txt

      - name: Post schema drift comment on PR
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/drift-report.txt', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Schema Drift Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Fail on breaking changes
        if: steps.changes.outputs.relevant == 'true' && steps.diff.outputs.exit_code != '0'
        run: |
          echo "❌ Breaking schema changes detected. PR is blocked."
          echo "To intentionally accept these changes, run the 'Update Schema Baseline' workflow after approval."
          exit 1
