name: Spec Lint
on:
  pull_request:
jobs:
  lint:
    name: Validate tracking specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^(specs/.*\.yaml|conventions/conventions\.yaml|scripts/linter/spec-linter\.js)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "✓ No spec/convention/linter changes — skipping lint (reporting success)"
            {
              echo "## ✅ Spec Lint — N/A for this PR"
              echo ""
              echo "This PR contains no \`specs/**\`, \`conventions/conventions.yaml\`, or linter-script changes. Spec validation does not apply to brief-only PRs."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "$CHANGED"
          fi
      - name: Setup Node.js
        if: steps.changes.outputs.relevant == 'true' 
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci
      - name: Lint all specs in specs/
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -e
          FAILED=0
          SPECS=$(find specs/ -name "*.yaml" | sort)
          if [ -z "$SPECS" ]; then
            echo "No spec files found in specs/ — skipping."
            exit 0
          fi
          for spec in $SPECS; do
            echo ""
            echo "──────────────────────────────────────"
            echo "Linting: $spec"
            echo "──────────────────────────────────────"
            node scripts/linter/spec-linter.js "$spec" || FAILED=1
          done
          echo ""
          if [ $FAILED -eq 1 ]; then
            echo "❌ One or more specs failed validation. Merge blocked."
            exit 1
          else
            echo "✅ All specs passed validation."
          fi
