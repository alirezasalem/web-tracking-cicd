spec_id: SPEC-2026-005-remove_from_cart
version: 1.0.0
status: draft
owner: Web Analytics Team
feature_brief_ref: FB-005
generated_by: claude-api-agent
created_at: 2026-04-17
updated_at: 2026-04-17

events:
  - name: remove_from_cart
    trigger:
      action: button_click
      selector: "[data-testid='remove-item-btn']"
      page_path: /cart
    priority: P1
    parameters:
      - name: currency
        type: string
        required: true
        example: "USD"
      - name: value
        type: number
        required: true
        example: 29.99
      - name: items
        type: array
        required: true
        example: [{"item_id": "SKU123", "item_name": "Sample Product", "price": 29.99, "quantity": 1, "item_category": "Electronics"}]
      - name: item_id
        type: string
        required: true
        example: "SKU123"
      - name: item_name
        type: string
        required: true
        example: "Sample Product"
      - name: price
        type: number
        required: true
        example: 29.99
      - name: quantity
        type: number
        required: true
        example: 1
      - name: item_category
        type: string
        required: false
        example: "Electronics"
    notes: "Fires only on full item removal, not quantity decreases. Must include complete ecommerce structure with items array. Deduplication logic prevents multiple fires on rapid clicks."

acceptance_criteria:
  - "Event fires once per remove button click, not on quantity changes to non-zero values"
  - "Event appears in GA4 DebugView within 5 seconds of clicking remove"
  - "All required ecommerce parameters present in correct structure"
  - "No duplicate events on rapid button clicks"
  - "Items array contains complete product details for removed item"
  - "Currency and value reflect the removed item's contribution to cart total"
